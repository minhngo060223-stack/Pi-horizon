# Suban Data Platform
# Runs Suban services connecting to existing pi-mainnet and pi-testnet nodes
#
# Architecture:
#   Internet → Cloudflare → Cloudflared → Caddy → Suban Services → Pi Nodes
#
# Prerequisites:
#   docker compose -f docker-compose.pi-mainnet-node.yml up -d
#   testnet2 must be running (Pi Node's own container)
#
# Usage:
#   docker compose -f docker-compose.suban.yml up -d --build
#
# Subdomains:
#   rpc.suban.org      → Mainnet JSON-RPC (port 8003)
#   testnet.suban.org  → Testnet Horizon API (port 8000)
#   oracle.suban.org   → Price oracle + on-chain analytics
#   testrpc.suban.org  → Testnet JSON-RPC (port 8003)
#   horizon.suban.org  → Mainnet Horizon API

services:
  # ======================================================================
  # SUBAN API - Horizon wrapper with caching + rate limiting
  # ======================================================================
  suban-api:
    build:
      context: ../Suban-api
      dockerfile: Dockerfile
    container_name: suban-api
    restart: on-failure
    environment:
      - PORT=4000
      - NODE_ENV=production
      - HORIZON_URL=http://pi-mainnet:8000
      - NETWORK=mainnet
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX_REQUESTS=100
      - CACHE_TTL_SECONDS=5
      - LOG_LEVEL=info
    networks:
      - suban-net

  # ======================================================================
  # SUBAN CONTROLLER - Data oracle (price feeds + on-chain analytics)
  # ======================================================================
  suban-controller:
    build:
      context: ../suban-controller
      dockerfile: Dockerfile
    container_name: suban-controller
    restart: on-failure
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NETWORK=mainnet
      - HORIZON_MAINNET_URL=http://pi-mainnet:8000
      - HORIZON_TESTNET_URL=http://testnet2:8000
      - CACHE_TTL_SECONDS=10
      - CHAIN_DATA_CACHE_TTL=30
      - OUTLIER_THRESHOLD_PERCENT=10
      - MIN_SOURCES_REQUIRED=1
      - PI_SYMBOL_COINGECKO=pi-network
      - PI_SYMBOL_OKX=PI-USDT
      - PI_SYMBOL_BITGET=PIUSDT
      - WEIGHT_COINGECKO=1.5
      - WEIGHT_OKX=2.0
      - WEIGHT_BITGET=2.0
      - TX_STREAM_POLL_MS=5000
      - TX_STREAM_BUFFER_SIZE=100
      - LOG_LEVEL=info
    networks:
      - suban-net

  # ======================================================================
  # CADDY - Internal reverse proxy
  # ======================================================================
  caddy:
    image: caddy:2-alpine
    container_name: suban-caddy
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - suban-api
      - suban-controller
    networks:
      - suban-net

  # ======================================================================
  # CLOUDFLARED - Cloudflare tunnel
  # ======================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: suban-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - caddy
    networks:
      - suban-net

volumes:
  caddy_data:
  caddy_config:

networks:
  suban-net:
    external: true
    name: docker_default
